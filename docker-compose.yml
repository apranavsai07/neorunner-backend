version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neorunner_db
    environment:
      POSTGRES_USER: neorunner_user
      POSTGRES_PASSWORD: neorunner_password
      POSTGRES_DB: neorunner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neorunner_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: neorunner_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
